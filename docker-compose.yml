# Run the DM Screen as a web service on your laptop:
#   docker compose up -d --build
# then open http://localhost:8080
#
# The container is a tiny Node server that serves the built site, the /ddb-api
# proxy, and the /backup-api on-disk backup. Your working data lives in each
# browser's localStorage (use the in-app Export / Import to move it between
# machines), but the app ALSO auto-saves a copy to ./backups on the host (see
# the `volumes:` bind-mount below) so it survives a browser-data clear.
#
# ── "D&D Beyond (exact / rendered)" inside Docker ─────────────────────────────
# The app image has NO browser baked in (keeps it tiny). The rendered scrape
# needs a browser to drive — pick ONE of these, or neither:
#
#  A) Bundled browser, zero host setup (opt-in `browserless` profile):
#       docker compose --profile browserless up -d --build
#     Pulls a ~1GB image once; dm-screen drives it over the compose network.
#     browserless spawns Chrome on-demand per scrape, so it's idle-cheap.
#
#  B) Your own browser on the HOST (no extra image to pull). On the host:
#       npx playwright install chromium-headless-shell        # once
#       chromium-headless-shell --headless --remote-debugging-port=9222 \
#           --remote-debugging-address=0.0.0.0                # leave running
#     then point the app at it (overrides the default below):
#       BROWSER_CDP_URL=http://host.docker.internal:9222 docker compose up -d --build
#     (An open debugging port is sensitive — keep it on a trusted network.)
#
#  C) Neither: `docker compose up -d --build`. The rendered scrape reports that
#     no browser is available; the "D&D Beyond (native)" JSON provider still
#     works fully.
#
# BROWSER_CDP_URL defaults to the browserless service so route A needs no extra
# env. No browserless.io account is needed — TOKEN is a secret you choose; it
# just has to match the ?token= below. browserless publishes no host port, so
# its CDP endpoint is reachable only by dm-screen, not your LAN.
services:
  dm-screen:
    build: .
    container_name: dm-screen
    ports:
      - "80:8080"     # reach it at http://<host>/ (e.g. a hosts-file name, no port)
      - "8080:8080"   # also still reachable at :8080
    environment:
      # defaults to the browserless service (route A); override for route B
      - BROWSER_CDP_URL=${BROWSER_CDP_URL:-ws://browserless:3000?token=local-dev-token}
    volumes:
      # On-disk backups, as a HOST bind-mount (a real folder in this project dir),
      # NOT a named Docker volume — so `docker system prune` / wiping Docker data
      # can never delete them. The app writes latest.json + timestamped snapshots
      # here automatically.
      - ./backups:/app/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: dm-screen-browser
    profiles: ["browserless"]   # opt-in: only starts with `--profile browserless`
    environment:
      - TOKEN=local-dev-token   # required by browserless v2; must match ?token= above
      - CONCURRENT=1            # one scrape at a time is plenty for character imports
      - TIMEOUT=60000           # kill a stuck session after 60s
    mem_limit: 1g               # hard cap so a runaway Chrome can't eat the box
    restart: unless-stopped
    # no host port published — only dm-screen reaches it, over the internal network
