# Run the DM Screen as a web service on your laptop:
#   docker compose up -d --build
# then open http://localhost:8080
#
# The container is a tiny Node server that serves the built site AND the
# /ddb-api proxy. It is stateless — your data lives in each browser's
# localStorage; use the in-app Export / Import to move it between machines.
#
# ── "D&D Beyond (exact / rendered)" inside Docker ─────────────────────────────
# The app image has NO browser baked in (keeps it tiny). The rendered scrape is
# served instead by a self-hosted `browserless` container on the compose network;
# dm-screen connects to it over CDP via BROWSER_CDP_URL. browserless launches
# Chrome on-demand per scrape and reaps it, so nothing heavy runs while idle.
#
# No browserless.io account is needed — TOKEN is a secret you choose; it just has
# to match the ?token= in BROWSER_CDP_URL below. The browserless port is NOT
# published, so its CDP endpoint is reachable only by dm-screen, not your LAN.
#
# Start everything with:  docker compose up -d --build
# The "D&D Beyond (native)" JSON provider works without any browser regardless.
services:
  dm-screen:
    build: .
    container_name: dm-screen
    ports:
      - "8080:8080"
    environment:
      # talk to the browserless service over the compose network
      - BROWSER_CDP_URL=ws://browserless:3000?token=local-dev-token
    depends_on:
      - browserless
    restart: unless-stopped

  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: dm-screen-browser
    environment:
      - TOKEN=local-dev-token   # required by browserless v2; must match ?token= above
      - CONCURRENT=1            # one scrape at a time is plenty for character imports
      - TIMEOUT=60000           # kill a stuck session after 60s
    mem_limit: 1g               # hard cap so a runaway Chrome can't eat the box
    restart: unless-stopped
    # no host port published — only dm-screen reaches it, over the internal network
